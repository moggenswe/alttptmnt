<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Go mode panel</title>
<!--
  OBS browser source that shows how close each slot of the ALttP + TMNT seed is to its goal.

  Add it in OBS as a Browser source with a local file, then add the query string to the URL, e.g.
    file:///C:/Project/tmntalttp/tools/obs/go-mode.html?server=ws://localhost:38281&alttp=Link&tmnt=Turtles
  Parameters: server (ws:// address), alttp and tmnt (slot names), password, demo=1 (fake data, no server),
  layout=row|column.

  It connects twice to the Archipelago server as a "Tracker" client (one connection per slot, read only)
  and reads what any tracker can read:
    TMNT  turtles received (x/4) and "Area N - Boss" locations checked (x/3); GO MODE when the Technodrome
          is in logic (4 turtles, 3 bosses). The "Area N Cleared" events have no IDs, so bosses are counted
          from their locations instead.
    ALttP dungeon bosses checked (x/10). Crystals are events without IDs and the prizes are shuffled
          between dungeons, so the panel cannot count them; the runner sees them in the game's map.
  A slot shows DONE once its client has reported the goal (client status 30).
-->
<style>
  :root {
    --bg: transparent;
    --card: rgba(10, 14, 28, 0.82);
    --text: #f4f4f4;
    --muted: #8a93a6;
    --hyrule: #6fd36f;
    --newyork: #4fb3ff;
    --go: #ffd84a;
    --done: #6fd36f;
    --bad: #ff6b6b;
  }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 600 22px/1.25 "Segoe UI", system-ui, sans-serif; }
  .panel { display: flex; gap: 12px; padding: 8px; }
  .panel.column { flex-direction: column; }
  .card { background: var(--card); border-radius: 10px; padding: 10px 16px; min-width: 260px;
    border-left: 6px solid var(--muted); }
  .card.hyrule { border-left-color: var(--hyrule); }
  .card.newyork { border-left-color: var(--newyork); }
  .title { font-size: 15px; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }
  .state { font-size: 30px; margin: 2px 0 4px; }
  .state.go { color: var(--go); }
  .state.done { color: var(--done); }
  .state.off { color: var(--bad); font-size: 20px; }
  .rows { display: flex; gap: 18px; flex-wrap: wrap; font-size: 20px; }
  .rows b { color: var(--go); }
  .icons { display: flex; gap: 4px; align-items: center; margin: 4px 0; }
  .icons .gap { width: 10px; }
  .icon { width: 36px; height: 36px; image-rendering: pixelated; transition: opacity 0.4s, filter 0.4s; }
  .icon.small { width: 28px; height: 28px; }
  .icon.off { opacity: 0.22; filter: grayscale(1); }
  .icons.grid { display: grid; grid-template-columns: repeat(9, 36px); gap: 4px; }
  .slot { position: relative; width: 36px; height: 36px; }
  .slot .level { position: absolute; right: -2px; bottom: -4px; font-size: 14px; color: var(--go);
    text-shadow: 0 0 3px #000, 0 0 3px #000; }
</style>
</head>
<body>
<div class="panel" id="panel">
  <div class="card hyrule"><div class="title">Hyrule · Ganon</div>
    <div class="state" id="alttp-state">Connecting…</div>
    <div class="icons grid" id="alttp-items"></div>
    <div class="icons" id="alttp-hearts"></div>
    <div class="rows"><span>Bosses <b id="alttp-bosses">–</b></span></div></div>
  <div class="card newyork"><div class="title">New York · Shredder</div>
    <div class="state" id="tmnt-state">Connecting…</div>
    <div class="icons" id="tmnt-turtle-icons"></div>
    <div class="icons" id="tmnt-gear-icons"></div>
    <div class="rows"><span>Turtles <b id="tmnt-turtles">–</b></span>
      <span>Bosses <b id="tmnt-bosses">–</b></span></div></div>
</div>
<script>
"use strict";
const params = new URLSearchParams(location.search);
const SERVER = params.get("server") || "ws://localhost:38281";
const PASSWORD = params.get("password") || "";
const CLIENT_GOAL = 30;
if (params.get("layout") === "column") document.getElementById("panel").classList.add("column");

const ALTTP = "A Link to the Past";
const TMNT = "Teenage Mutant Ninja Turtles";
const ALTTP_BOSSES = ["Eastern Palace", "Desert Palace", "Tower of Hera", "Palace of Darkness", "Swamp Palace",
  "Skull Woods", "Thieves' Town", "Ice Palace", "Misery Mire", "Turtle Rock"].map(d => `${d} - Boss`);
const TMNT_BOSSES = [1, 2, 3, 4, 5].map(n => `Area ${n} - Boss`);
const TURTLES = ["Leonardo", "Michelangelo", "Donatello", "Raphael"];
const CLEARS_FOR_TECHNODROME = 3;  // apworld/tmnt/rules.py
// The A Link to the Past items that matter on the way to Ganon: [label, sprite, {AP item name: level}].
// Progressive items show their level (sword 1-4, bow 1-2, gloves 1-2); a "Progressive ..." item adds one.
const ALTTP_ITEMS = [
  ["Sword", "alttp_sword", { "Fighter Sword": 1, "Master Sword": 2, "Tempered Sword": 3, "Golden Sword": 4 },
   "Progressive Sword"],
  ["Bow", "alttp_bow", { "Bow": 1, "Silver Bow": 2 }, "Progressive Bow"],
  ["Hookshot", "alttp_hookshot"], ["Hammer", "alttp_hammer"], ["Fire Rod", "alttp_firerod"],
  ["Ice Rod", "alttp_icerod"], ["Lamp", "alttp_lamp"], ["Magic Mirror", "alttp_mirror"], ["Moon Pearl", "alttp_pearl"],
  ["Flippers", "alttp_flippers"], ["Pegasus Boots", "alttp_boots"],
  ["Gloves", "alttp_glove", { "Power Glove": 1, "Titans Mitts": 2 }, "Progressive Glove"],
  ["Book of Mudora", "alttp_book"], ["Cane of Somaria", "alttp_somaria"], ["Flute", "alttp_flute"],
  ["Bombos", "alttp_bombos"], ["Ether", "alttp_ether"], ["Quake", "alttp_quake"],
];

function level(items, [label, , fixed, progressive]) {
  if (!fixed) return items.has(label) ? 1 : 0;
  const best = Math.max(0, ...Object.entries(fixed).filter(([name]) => items.has(name)).map(([, lv]) => lv));
  return Math.max(best, items.get(progressive) || 0);
}

const $ = id => document.getElementById(id);

// Our own pixel icons, drawn for this project by tools/sprites.py (no game sprites, no fan art).
function icon(sprite, title, small = false) {
  return Object.assign(document.createElement("img"), { src: `sprites/${sprite}.png`, title, alt: title,
    className: small ? "icon small off" : "icon off" });
}
const gap = () => Object.assign(document.createElement("span"), { className: "gap" });
const iconsFor = {};  // item or location name -> its icon
for (const turtle of TURTLES) {
  $("tmnt-turtle-icons").appendChild(iconsFor[turtle] = icon(turtle.toLowerCase(), turtle));
}
$("tmnt-turtle-icons").appendChild(gap());
TMNT_BOSSES.forEach(boss => $("tmnt-turtle-icons").appendChild(iconsFor[boss] = icon("boss", boss, true)));
[["Missile Pack", "missile"], ["Rope Pack", "rope"], ["Zora's Scuba Kit", "scuba"]].forEach(
  ([name, sprite]) => $("tmnt-gear-icons").appendChild(iconsFor[name] = icon(sprite, name)));
$("tmnt-gear-icons").appendChild(gap());
[1, 2, 3, 4, 5].forEach(n => $("tmnt-gear-icons").appendChild(
  iconsFor[`Sewer Pass: Area ${n}`] = icon("pass", `Sewer Pass: Area ${n}`, true)));
ALTTP_BOSSES.forEach(boss => $("alttp-hearts").appendChild(iconsFor[boss] = icon("heart", boss, true)));
const levelFor = {};  // ALttP item label -> its level badge
for (const [label, sprite, fixed] of ALTTP_ITEMS) {
  const slot = Object.assign(document.createElement("span"), { className: "slot" });
  slot.appendChild(iconsFor[label] = icon(sprite, label));
  if (fixed) slot.appendChild(levelFor[label] = Object.assign(document.createElement("b"), { className: "level" }));
  $("alttp-items").appendChild(slot);
}

function light(names, has) {
  for (const name of names) iconsFor[name].classList.toggle("off", !has(name));
}

function renderTmnt(s) {
  if (s.error) { $("tmnt-state").className = "state off"; $("tmnt-state").textContent = s.error; return; }
  const gear = ["Missile Pack", "Rope Pack", "Zora's Scuba Kit", ...[1, 2, 3, 4, 5].map(n => `Sewer Pass: Area ${n}`)];
  light([...TURTLES, ...gear], name => s.items.has(name));
  light(TMNT_BOSSES, name => s.checked.has(name));
  const turtles = TURTLES.filter(t => s.items.has(t)).length;
  const bosses = TMNT_BOSSES.filter(l => s.checked.has(l)).length;
  $("tmnt-turtles").textContent = `${turtles}/4`;
  $("tmnt-bosses").textContent = `${Math.min(bosses, CLEARS_FOR_TECHNODROME)}/${CLEARS_FOR_TECHNODROME}`;
  const go = turtles === 4 && bosses >= CLEARS_FOR_TECHNODROME;
  const state = s.goal ? ["done", "DONE ✔"] : go ? ["go", "GO MODE"] : ["", "Not yet"];
  $("tmnt-state").className = `state ${state[0]}`;
  $("tmnt-state").textContent = state[1];
}

function renderAlttp(s) {
  if (s.error) { $("alttp-state").className = "state off"; $("alttp-state").textContent = s.error; return; }
  light(ALTTP_BOSSES, name => s.checked.has(name));
  for (const entry of ALTTP_ITEMS) {
    const lv = level(s.items, entry);
    iconsFor[entry[0]].classList.toggle("off", lv === 0);
    if (levelFor[entry[0]]) levelFor[entry[0]].textContent = lv > 1 ? lv : "";
  }
  const bosses = ALTTP_BOSSES.filter(l => s.checked.has(l)).length;
  $("alttp-bosses").textContent = `${bosses}/10`;
  const state = s.goal ? ["done", "DONE ✔"] : ["", "Not yet"];
  $("alttp-state").className = `state ${state[0]}`;
  $("alttp-state").textContent = state[1];
}

// One read-only Tracker connection per slot. Reconnects every 5 s if the server goes away.
function track(slot, game, render) {
  if (!slot) { render({ error: "No slot given" }); return; }
  const s = { items: new Map(), checked: new Set(), goal: false };  // items: name -> how many received
  let itemNames = {}, locationNames = {}, team = 0, slotId = 0;

  const connect = () => {
    const ws = new WebSocket(SERVER);
    const send = msg => ws.send(JSON.stringify([msg]));
    ws.onmessage = event => {
      for (const msg of JSON.parse(event.data)) {
        if (msg.cmd === "RoomInfo") {
          send({ cmd: "GetDataPackage", games: [game] });
        } else if (msg.cmd === "DataPackage") {
          const data = msg.data.games[game];
          if (!data) { render({ error: "Game not in this seed" }); ws.onclose = null; ws.close(); return; }
          itemNames = Object.fromEntries(Object.entries(data.item_name_to_id).map(([n, id]) => [id, n]));
          locationNames = Object.fromEntries(Object.entries(data.location_name_to_id).map(([n, id]) => [id, n]));
          send({ cmd: "Connect", password: PASSWORD, game: "", name: slot, uuid: `go-mode-${slot}`,
                 version: { major: 0, minor: 6, build: 8, class: "Version" }, items_handling: 7,
                 tags: ["Tracker"], slot_data: false });
        } else if (msg.cmd === "ConnectionRefused") {
          render({ error: `Refused: ${(msg.errors || []).join(", ")}` });
        } else if (msg.cmd === "Connected") {
          team = msg.team; slotId = msg.slot;
          s.checked = new Set(msg.checked_locations.map(id => locationNames[id]));
          const key = `_read_client_status_${team}_${slotId}`;
          send({ cmd: "Get", keys: [key] });
          send({ cmd: "SetNotify", keys: [key] });
        } else if (msg.cmd === "ReceivedItems") {
          if (msg.index === 0) s.items = new Map();
          for (const item of msg.items) {
            const name = itemNames[item.item];
            s.items.set(name, (s.items.get(name) || 0) + 1);
          }
        } else if (msg.cmd === "RoomUpdate" && msg.checked_locations) {
          for (const id of msg.checked_locations) s.checked.add(locationNames[id]);
        } else if (msg.cmd === "Retrieved" || msg.cmd === "SetReply") {
          const values = msg.cmd === "Retrieved" ? msg.keys : { [msg.key]: msg.value };
          for (const value of Object.values(values)) s.goal = value === CLIENT_GOAL;
        } else {
          continue;
        }
        render(s);
      }
    };
    ws.onclose = () => { render({ error: "No server" }); setTimeout(connect, 5000); };
  };
  connect();
}

if (params.get("demo")) {
  const owned = names => new Map(names.map(name => [name, 1]));
  renderAlttp({ items: new Map([...owned(["Hookshot", "Lamp", "Moon Pearl", "Flippers", "Pegasus Boots",
                                          "Magic Mirror", "Fire Rod", "Bombos", "Book of Mudora"]),
                                ["Progressive Sword", 2], ["Progressive Glove", 1], ["Progressive Bow", 1]]),
                checked: new Set(ALTTP_BOSSES.slice(0, 6)), goal: false });
  renderTmnt({ items: owned([...TURTLES, "Rope Pack", "Zora's Scuba Kit", "Sewer Pass: Area 1",
                             "Sewer Pass: Area 2", "Sewer Pass: Area 4"]),
               checked: new Set(TMNT_BOSSES.slice(0, 3)), goal: false });
} else {
  track(params.get("alttp"), ALTTP, renderAlttp);
  track(params.get("tmnt"), TMNT, renderTmnt);
}
</script>
</body>
</html>
